<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Gradient for Connections -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 48px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #cbd5e1;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #a855f7;
    }
    
    /* Dynamic floating particles/nodes in background */
    @keyframes pulseNode {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.25); opacity: 1; }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }
    .pulsing-node {
      animation: pulseNode 4s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    .causal-line {
      stroke-dasharray: 8 6;
      animation: dashMove 3s linear infinite;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGrad)" rx="16"/>

  <!-- Background Causal Graph Visuals (Dynamic/Animated behind text) -->
  <g opacity="0.35">
    <!-- Connecting Causal Arrows -->
    <path class="causal-line" d="M 150,80 Q 300,40 450,100 T 750,60" fill="none" stroke="url(#lineGrad)" stroke-width="2"/>
    <path class="causal-line" d="M 800,220 Q 950,260 1100,180" fill="none" stroke="url(#lineGrad)" stroke-width="2"/>
    <path class="causal-line" d="M 100,240 Q 250,180 400,220" fill="none" stroke="#3b82f6" stroke-width="2"/>
    
    <!-- Causal Nodes (Background floating elements) -->
    <circle class="pulsing-node" cx="150" cy="80" r="16" fill="#818cf8" filter="url(#glow)"/>
    <circle class="pulsing-node" cx="450" cy="100" r="22" fill="#ec4899" filter="url(#glow)" style="animation-delay: 1s;"/>
    <circle class="pulsing-node" cx="750" cy="60" r="14" fill="#8b5cf6" filter="url(#glow)" style="animation-delay: 2s;"/>
    <circle class="pulsing-node" cx="1100" cy="180" r="28" fill="#3b82f6" filter="url(#glow)" style="animation-delay: 1.5s;"/>
    <circle class="pulsing-node" cx="800" cy="220" r="18" fill="#06b6d4" filter="url(#glow)" style="animation-delay: 0.5s;"/>
    
    <!-- Semi-transparent DAG structure links -->
    <line x1="450" y1="100" x2="800" y2="220" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="750" y1="60" x2="1100" y2="180" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- Foreground Title and Content Card -->
  <g transform="translate(60, 65)">
    <!-- Pill Tag -->
    <rect x="0" y="0" width="170" height="32" rx="16" fill="#3b0764" stroke="#a855f7" stroke-width="1.5"/>
    <text x="85" y="21" text-anchor="middle" class="badge-text">⚡ CAUSAL AI &amp; XAI</text>

    <!-- Main Title -->
    <text x="0" y="90" class="title">Awesome Causal AI Platform</text>
    
    <!-- Subtitle -->
    <text x="0" y="130" class="subtitle">Curated Ecosystem of Causal Inference, Treatment Effects &amp; Decision Intelligence</text>
    
    <!-- Decorative underline -->
    <rect x="0" y="152" width="480" height="4" rx="2" fill="url(#lineGrad)"/>
  </g>
</svg>
