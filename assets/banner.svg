<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 300"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#311042"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><linearGradient id="lineGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1" stop-opacity=".8"/><stop offset="100%" stop-color="#ec4899" stop-opacity=".8"/></linearGradient></defs><style>@keyframes pulseNode{0%{transform:scale(1);opacity:.6}50%{transform:scale(1.25);opacity:1}}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:48px;fill:#fff;letter-spacing:-.5px}.subtitle{font-weight:400;font-size:20px;fill:#cbd5e1}.badge-text{font-weight:600;font-size:14px;fill:#a855f7}.pulsing-node{animation:pulseNode 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.causal-line{stroke-dasharray:8 6;animation:dashMove 3s linear infinite}</style><rect width="1200" height="300" fill="url(#bgGrad)" rx="16"/><g opacity=".35"><path fill="none" stroke="url(#lineGrad)" stroke-width="2" d="M 150,80 Q 300,40 450,100 T 750,60" class="causal-line"/><path fill="none" stroke="url(#lineGrad)" stroke-width="2" d="M 800,220 Q 950,260 1100,180" class="causal-line"/><path fill="none" stroke="#3b82f6" stroke-width="2" d="M 100,240 Q 250,180 400,220" class="causal-line"/><circle cx="150" cy="80" r="16" fill="#818cf8" class="pulsing-node" filter="url(#glow)"/><circle cx="450" cy="100" r="22" fill="#ec4899" class="pulsing-node" filter="url(#glow)" style="animation-delay:1s"/><circle cx="750" cy="60" r="14" fill="#8b5cf6" class="pulsing-node" filter="url(#glow)" style="animation-delay:2s"/><circle cx="1100" cy="180" r="28" fill="#3b82f6" class="pulsing-node" filter="url(#glow)" style="animation-delay:1.5s"/><circle cx="800" cy="220" r="18" fill="#06b6d4" class="pulsing-node" filter="url(#glow)" style="animation-delay:.5s"/><line x1="450" x2="800" y1="100" y2="220" stroke="#94a3b8" stroke-dasharray="4 4" stroke-width="1.5"/><line x1="750" x2="1100" y1="60" y2="180" stroke="#94a3b8" stroke-dasharray="4 4" stroke-width="1.5"/></g><g transform="translate(60, 65)"><rect width="170" height="32" x="0" y="0" fill="#3b0764" stroke="#a855f7" stroke-width="1.5" rx="16"/><text x="85" y="21" class="badge-text" text-anchor="middle">⚡ CAUSAL AI &amp; XAI</text><text x="0" y="90" class="title">Awesome Causal AI Platform</text><text x="0" y="130" class="subtitle">Curated Ecosystem of Causal Inference, Treatment Effects &amp; Decision Intelligence</text><rect width="480" height="4" x="0" y="152" fill="url(#lineGrad)" rx="2"/></g></svg>